name: Publicar player e notícias (GitHub Pages)

# Publica o player (app/src/main/assets/web) + painel/ em
# https://estivendjgutti-dot.github.io/tvbarber/  e gera news.json a partir do RSS.
# A TV (APK com START_URL apontando para lá) pega conteúdo novo sem reinstalar.
on:
  push:
    branches: [main]
    paths:
      - "app/src/main/assets/web/**"
      - "painel/**"
      - "tools/**"
      - ".github/workflows/pages.yml"
  schedule:
    - cron: "*/30 * * * *"   # atualiza as notícias a cada 30 min
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Montar o site
        run: |
          mkdir -p _site
          cp -r app/src/main/assets/web/. _site/
          cp -r painel _site/painel
          python tools/build_news.py _site/news.json || echo "::warning::Notícias indisponíveis agora; a TV usa o último cache"
          touch _site/.nojekyll

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
