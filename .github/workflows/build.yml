name: Build APK

on:
  push:
    branches: [main]
    # Conteúdo/player web vai pelo GitHub Pages (pages.yml): não precisa de APK novo.
    paths-ignore:
      - "app/src/main/assets/web/**"
      - "painel/**"
      - "tools/**"
      - "docs/**"
      - "**.md"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      # Assinatura fixa (opcional, mas necessária pra atualizar o app sem desinstalar)
      - name: Decodificar keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::Sem KEYSTORE_BASE64: APK assinado com chave debug temporária"
          fi

      - name: Compilar APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          START_URL: ${{ vars.START_URL }}
          ALLOWED_ORIGINS: ${{ vars.ALLOWED_ORIGINS }}
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Renomear
        run: cp app/build/outputs/apk/release/*.apk "tv-launcher-${{ github.run_number }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: tv-launcher-apk
          path: tv-launcher-*.apk

      # Link fixo pra baixar direto no celular/box: Releases > "latest"
      - name: Publicar release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Build ${{ github.run_number }}
          files: tv-launcher-*.apk
          make_latest: true
